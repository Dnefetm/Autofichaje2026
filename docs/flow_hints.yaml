    - 3_propagar: encola job 'sync_price' (payload { publicacion_id }, priority 5) -> MeLi
  flujo_end_to_end: costos_articulo -> trg_costos_articulo_recalcular_async -> job recalc_pricing_bundle -> route.ts/handleRecalcPricingBundle -> fn_recalcular_precio_publicacion -> publicaciones_externas + publication_pricing_history -> job sync_price -> MeliAdapter.updatePrice

