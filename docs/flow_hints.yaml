# ====================================================================
# PROCESOS (pipelines de negocio) - consumido por generate_flow_blueprint.ts
# Capa declarativa curada: define ORDEN logico + fronteras externas que la
# introspeccion de Postgres no expone. El generador valida que cada 'fn' y
# 'estado' exista realmente en la BD (si no, el CI falla).
# ====================================================================
processes:
  importacion_precios:
    descripcion: Importacion de lista de precios de proveedor y aplicacion end-to-end.
    trigger: POST /api/precios/importar/[id]/iniciar-parser
    ingesta:
      tabla_staging: listas_precios_raw_staging
      columna_modelo: CLAVE
      columna_codigo: CODIGO DE BARRA SIN CERO
    steps:
      - fn: public.fn_preparar_importacion_revision
        estado: mapeando
      - fn: public.fn_match_precios_v2
        estado: procesando
      - fn: public.fn_confirmar_matching_decisiones
        estado: en_revision
      - fn: public.fn_consolidar_matching_decisiones
        estado: matching_completo
      - fn: public.fn_resolver_y_poblar_costos
        tabla_destino: costos_articulo
      - fn: public.fn_marcar_vigente
        estado: completado
    downstream:
      - trigger: trg_costos_articulo_recalcular_async
        tabla: costos_articulo
      - job: recalc_pricing_bundle
        consumidor: apps/dashboard/src/app/api/worker/process/route.ts#handleRecalcPricingBundle
        expect_runtime: true
      - fn: public.fn_recalcular_precio_publicacion
        destino: publication_pricing_history
      - job: sync_price
        consumidor: apps/dashboard/src/app/api/worker/process/route.ts#handleSyncPrice
        productor: recalc_pricing_bundle
        expect_runtime: false
        # blocked_by eliminado 2026-08-24: pricing_data_blocker RESUELTO en vivo (10,252 costos vigentes).
        # Sin trafico observado aun por guardas de negocio (sync_disabled / pricing_status != 'ok').
    state_machine: importacion
    recovery:
      desde: error
      rutas: [mapeando, procesando, completado]
      motivo: Resuelve error 23514; el lote en error reintenta hasta completado sin intervencion.

  # ==================================================================
  # Procesos declarados (Fase 2.9, 2026-08-25). Cada fn esta validada
  # contra el catalogo real: si deja de existir, el CI falla (FN_MISSING).
  # ==================================================================
  sync_stock_inventario:
    descripcion: Sincronizacion de stock hacia MeLi tras movimientos de inventario (ingresos/egresos/ajustes).
    trigger: Cambios en ingresos/egresos (trg_stock_after_*) o en inventory_snapshot (trg_encolar_sync_stock)
    steps:
      - fn: public.trg_fn_sync_stock
      - fn: public.fn_recalcular_stock
        tabla_destino: inventory_snapshot
      - fn: public.fn_encolar_sync_stock
        tabla_destino: jobs
    downstream:
      - job: sync_stock
        consumidor: apps/dashboard/src/app/api/worker/process/route.ts
        expect_runtime: true
      - job: sync_stock_mapped
        consumidor: apps/dashboard/src/components/mapping-modal.tsx
        expect_runtime: true

  proceso_venta_meli:
    descripcion: Procesamiento de venta de Mercado Libre y decremento seguro de stock.
    trigger: Webhook MeLi (POST /api/webhooks/meli)
    steps:
      - fn: public.decrement_stock_safe
        tabla_destino: inventory_snapshot
    downstream:
      - job: process_sale
        consumidor: apps/dashboard/src/app/api/webhooks/meli/route.ts
        expect_runtime: true
      - job: sync_stock
        consumidor: apps/dashboard/src/app/api/worker/process/route.ts
        expect_runtime: true

  pricing_publicacion_v3:
    descripcion: Recalculo de precio de publicacion (ruta v3, unica ALIVE) y propagacion a MeLi.
    trigger: Cambios en publicaciones_externas (trg_recalcular_precio_publicacion) o job recalc_pricing_bundle
    steps:
      - fn: public.fn_recalcular_precio_publicacion
        tabla_destino: publication_pricing_history
      - fn: public.fn_resolver_regla_pricing
    downstream:
      - job: recalc_pricing_bundle
        consumidor: apps/dashboard/src/app/api/worker/process/route.ts#handleRecalcPricingBundle
        expect_runtime: true
      - job: sync_price
        consumidor: apps/dashboard/src/app/api/worker/process/route.ts#handleSyncPrice
        expect_runtime: false
        # Sin trafico por guardas de negocio (sync_disabled / pricing_status != 'ok')

  autoficha_fichas:
    descripcion: Creacion y edicion de fichas tecnicas con extraccion, auditoria y campos regulatorios.
    trigger: UI de autoficha (guardar/editar ficha)
    steps:
      - fn: public.guardar_ficha_autoficha
        tabla_destino: fichas_tecnicas
      - fn: public.trigger_auditoria_ficha
        tabla_destino: ficha_auditoria
      - fn: public.crear_version_ficha
        tabla_destino: fichas_tecnicas
