name: Blueprint DB Guardian

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Cada hora
  push:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/generate_flow_blueprint.ts'
      - 'docs/flow_hints.yaml'
  pull_request:
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Blueprint
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx tsx scripts/generate_flow_blueprint.ts

      - name: Validate Blueprint Timings & Limits
        run: npx tsx scripts/ci_validate_blueprint.ts

      # Fase 4 (2026-08-25): el blueprint regenerado se commitea DIRECTO a main.
      # Antes se abria un PR a chore/update-blueprint que nadie mergeaba, y la
      # copia en main quedaba obsoleta (mentira visible). Los archivos generados
      # no estan en los paths del trigger, asi que no hay loop; [skip ci] es
      # seguridad adicional.
      - name: Commit updated blueprint to main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/db_flow_blueprint.json docs/db_flow_blueprint.md docs/.blueprint_schema_hash docs/.blueprint_processes_hash
          if git diff --cached --quiet; then
            echo "Sin cambios en el blueprint."
            exit 0
          fi
          git commit -m "chore(db): auto-update DB Flow Blueprint [skip ci]"
          git push origin HEAD:main
