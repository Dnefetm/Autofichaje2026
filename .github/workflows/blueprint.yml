name: Blueprint DB Guardian
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/generate_flow_blueprint.ts'
      - 'docs/flow_hints.yaml'
      - '.github/workflows/blueprint.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'docs/db_flow_blueprint.json'

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Generate DB Flow Blueprint
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx tsx scripts/generate_flow_blueprint.ts

      - name: Detect changes
        id: commit
        run: |
          git add docs/db_flow_blueprint.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git and commit
        if: steps.commit.outputs.changed == 'true'
        run: |
          git config user.name "blueprint-bot"
          git config user.email "blueprint-bot@users.noreply.github.com"
          git commit -m "chore(db): auto-update DB Flow Blueprint"

      - name: Push directo a main (con BLUEPRINT_PAT si existe)
        if: github.event_name != 'pull_request' && steps.commit.outputs.changed == 'true'
        id: push
        continue-on-error: true
        env:
          BP_PAT: ${{ secrets.BLUEPRINT_PAT }}
        run: |
          if [ -n "$BP_PAT" ]; then
            git remote set-url origin "https://x-access-token:${BP_PAT}@github.com/${{ github.repository }}.git"
          fi
          git push origin HEAD:main

      - name: Fallback - PR + auto-merge si el push directo falla
        if: github.event_name != 'pull_request' && steps.commit.outputs.changed == 'true' && steps.push.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force origin HEAD:chore/update-blueprint
          gh pr create --base main --head chore/update-blueprint --title "chore(db): Auto-update DB Flow Blueprint" --body "Blueprint regenerado automaticamente." || echo "PR ya existente."
          gh pr merge chore/update-blueprint --auto --squash || echo "Auto-merge ya configurado."
