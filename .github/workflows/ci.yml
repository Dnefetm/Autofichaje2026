name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Solo build (ignoreBuildErrors sigue activo). Se añadirá `tsc --noEmit`
      # cuando los errores de tipo del proyecto estén limpios.
      - name: Build dashboard
        run: npm run build -w @gestor/dashboard
