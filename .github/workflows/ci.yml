name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    env:
      # Placeholders no secretos: permiten que `next build` complete sin .env local.
      # `supabase-browser.ts` y `supabase-server.ts` usan `process.env.X!` sin fallback.
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
      OPENAI_API_KEY: "placeholder-openai-key"
      UPSTASH_REDIS_REST_URL: "https://placeholder.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "placeholder-upstash-token"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Solo build (ignoreBuildErrors sigue activo). Se añadirá `tsc --noEmit`
      # cuando los errores de tipo del proyecto estén limpios.
      - name: Build dashboard
        run: npm run build -w @gestor/dashboard
